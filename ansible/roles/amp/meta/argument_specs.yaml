argument_specs:
  main:
    short_description: Install the Amp CLI and configure a headless runner
    description:
      - Installs the Amp CLI for the existing agent user.
      - Writes an optional systemd user service for Amp runner mode.
    options:
      amp_install_url:
        description: URL of the Amp CLI installer.
        type: str
      amp_agent_user:
        description: User that owns and runs Amp.
        type: str
      amp_agent_group:
        description: Group that owns Amp files.
        type: str
      amp_agent_home:
        description: Home directory used by Amp.
        type: path
      amp_agent_path:
        description: PATH used while installing and running Amp.
        type: str
      amp_home:
        description: Amp data and binary directory.
        type: path
      amp_bin_dir:
        description: Directory containing the Amp binary.
        type: path
      amp_binary_path:
        description: Absolute path to the Amp binary.
        type: path
      amp_runner_workspace:
        description: Working directory accepted by the headless runner.
        type: path
      amp_runner_id:
        description: Stable hostname-like identifier shown for the runner.
        type: str
      amp_runner_service_name:
        description: Name of the systemd user service for the runner.
        type: str
      amp_runner_service_path:
        description: Absolute path to the systemd user service unit.
        type: path
      amp_runner_service_enabled:
        description: Whether to enable the runner service for the agent user.
        type: bool
      amp_runner_service_state:
        description: Desired runner service state.
        type: str
        choices:
          - started
          - stopped

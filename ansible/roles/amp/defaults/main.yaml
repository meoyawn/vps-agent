# Amp CLI installation and runner configuration.
amp_install_url: https://ampcode.com/install.sh
amp_agent_user: "{{ agent_user }}"
amp_agent_group: "{{ agent_group }}"
amp_agent_home: "{{ agent_home }}"
amp_agent_path: "{{ agent_path }}"

amp_home: "{{ amp_agent_home }}/.amp"
amp_bin_dir: "{{ amp_home }}/bin"
amp_binary_path: "{{ amp_bin_dir }}/amp"

# A runner accepts web-created threads in this directory. Override this value
# or run additional runners from other project directories when needed.
amp_runner_workspace: "{{ agent_workspace_root }}"
amp_runner_id: vps-agent
amp_runner_service_name: amp-runner.service
amp_runner_service_path: "{{ amp_agent_home }}/.config/systemd/user/{{ amp_runner_service_name }}"

# Amp authentication is deliberately not automated. Sign in once as the agent
# user, then enable this service to accept threads from ampcode.com.
amp_runner_service_enabled: false
amp_runner_service_state: stopped

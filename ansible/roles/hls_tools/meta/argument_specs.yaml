argument_specs:
  main:
    short_description: Install Apple HTTP Live Streaming Tools
    description:
      - Installs Apple HTTP Live Streaming Tools on supported Ubuntu hosts.
    options:
      hls_tools_archive_name:
        description: Name of the bundled Apple HLS Tools archive.
        type: str
      hls_tools_archive_sha256:
        description: Expected SHA-256 checksum of the bundled archive.
        type: str
      hls_tools_icu74_archive_name:
        description: Name of the bundled Ubuntu 24 ICU compatibility package.
        type: str
      hls_tools_icu74_archive_sha256:
        description: Expected SHA-256 checksum of the ICU compatibility package.
        type: str
      hls_tools_install_dir:
        description: Directory containing the Apple installer and extracted packages.
        type: path
      hls_tools_mediastreamvalidator_path:
        description: Expected path to the Media Stream Validator executable.
        type: path
      hls_tools_license_accepted:
        description: Whether to accept Apple's HLS Tools license agreement automatically.
        type: bool

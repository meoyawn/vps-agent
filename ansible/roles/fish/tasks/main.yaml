- name: Install fish package
  ansible.builtin.apt:
    name: fish
    state: present

- name: Ensure agent user login shell is fish
  ansible.builtin.user:
    name: "{{ agent_user }}"
    shell: "{{ agent_shell }}"

- name: Ensure fish config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ agent_user }}"
    group: "{{ agent_group }}"
    mode: "0755"
  loop:
    - "{{ agent_home }}/.config"
    - "{{ agent_fish_config_dir }}"

- name: Read controller fish shared config
  ansible.builtin.set_fact:
    __fish_controller_config_content: >-
      {{ lookup('ansible.builtin.file', ansible_controller_fish_config_dir ~ '/config.fish', rstrip=False) }}

- name: Reject machine-specific settings in controller fish shared config
  ansible.builtin.assert:
    that:
      - item not in __fish_controller_config_content
    fail_msg: >-
      controller config.fish contains forbidden machine-specific marker {{ item }};
      move controller-only settings to conf.d/macos.fish
  loop:
    - UV_PYTHON
    - /opt/homebrew
    - $HOME/Library
    - ~/Library
    - /Applications

- name: Sync controller fish config
  ansible.posix.synchronize:
    src: "{{ ansible_controller_fish_config_dir }}/"
    dest: "{{ agent_fish_config_dir }}/"
    archive: true
    checksum: true
    owner: false
    group: false
    perms: false
    delete: true
    rsync_path: "sudo -u {{ agent_user }} rsync"
    rsync_opts:
      - --exclude=.git/
      - --exclude=completions/
      - --exclude=conf.d/
      - --exclude=fish_variables
  register: fish_config_sync
  retries: 3
  delay: 5
  until: fish_config_sync is succeeded
  changed_when: false

- name: Ensure synced fish config is owned by agent
  ansible.builtin.file:
    path: "{{ agent_fish_config_dir }}"
    state: directory
    owner: "{{ agent_user }}"
    group: "{{ agent_group }}"
    recurse: true

- name: Remove controller fish completions from agent
  ansible.builtin.file:
    path: "{{ agent_fish_config_dir }}/completions"
    state: absent

- name: Stat agent fish universal variables
  ansible.builtin.stat:
    path: "{{ agent_fish_config_dir }}/fish_variables"
  register: fish_variables_stat

- name: Remove stale UV_PYTHON fish universal variable
  ansible.builtin.lineinfile:
    path: "{{ agent_fish_config_dir }}/fish_variables"
    regexp: '^SETUVAR UV_PYTHON:'
    state: absent
  when:
    - fish_variables_stat.stat.exists

- name: Ensure agent fish conf.d directory exists
  ansible.builtin.file:
    path: "{{ agent_fish_config_dir }}/conf.d"
    state: directory
    owner: "{{ agent_user }}"
    group: "{{ agent_group }}"
    mode: "0755"

- name: Find controller fish conf.d entries on agent
  ansible.builtin.find:
    paths: "{{ agent_fish_config_dir }}/conf.d"
    file_type: any
    hidden: true
    excludes:
      - agent_env.fish
  register: fish_conf_d_entries

- name: Remove controller fish conf.d entries from agent
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ fish_conf_d_entries.files }}"

- name: Install fish environment config
  ansible.builtin.template:
    src: conf.d/agent_env.fish.j2
    dest: "{{ agent_fish_env_config_path }}"
    owner: "{{ agent_user }}"
    group: "{{ agent_group }}"
    mode: "0644"

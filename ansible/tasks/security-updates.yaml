- name: Install unattended security updates
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 120

- name: Configure daily security updates and required overnight reboots
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/99vps-agent-security-updates
    owner: root
    group: root
    mode: "0644"
    validate: /usr/bin/apt-config -c %s dump
    content: |
      APT::Periodic::Enable "1";
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      #clear Unattended-Upgrade::Allowed-Origins;
      #clear Unattended-Upgrade::Origins-Pattern;
      #clear Unattended-Upgrade::Package-Blacklist;
      Unattended-Upgrade::Allowed-Origins {
          "${distro_id}:${distro_codename}";
          "${distro_id}:${distro_codename}-security";
          "${distro_id}ESMApps:${distro_codename}-apps-security";
          "${distro_id}ESM:${distro_codename}-infra-security";
      };
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-WithUsers "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:00";

- name: Enable and start the daily APT timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    masked: false
    enabled: true
    state: started
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer

- name: Assert the Ubuntu security kernel is supported
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
      - ansible_facts['distribution_version'] in agent_kernel_security_min_versions
      - agent_scc_arch in ['x86_64', 'arm64']
    fail_msg: Ubuntu 24.04 or 26.04 on x86_64 or ARM64 is required.

- name: Install the latest Ubuntu kernel metapackage
  ansible.builtin.apt:
    name: "{{ agent_kernel_metapackage }}"
    state: latest
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 120

- name: Boot the supported Ubuntu kernel and retire mainline packages
  when: not ansible_check_mode
  block:
    - name: Read the kernel selected by the Ubuntu metapackage
      ansible.builtin.command:
        argv:
          - dpkg-query
          - -W
          - -f=${Depends}
          - "{{ agent_kernel_metapackage }}"
      register: agent_kernel_dependencies
      changed_when: false

    - name: Resolve the Ubuntu kernel release
      ansible.builtin.set_fact:
        agent_kernel_release: >-
          {{ agent_kernel_dependencies.stdout
            | regex_findall('linux-image-([0-9][0-9.+-]*-generic)') | first }}

    - name: Validate GRUB configuration before rebooting
      ansible.builtin.command:
        argv:
          - grub-script-check
          - /boot/grub/grub.cfg
      changed_when: false

    - name: Check the security fix and boot prerequisites
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - |
            from pathlib import Path
            import re
            import subprocess
            import sys

            release, minimum = sys.argv[1:]
            version = subprocess.check_output(
                ['dpkg-query', '-W', '-f=${Version}', f'linux-image-{release}'], text=True).strip()
            subprocess.run(['dpkg', '--compare-versions', version, 'ge', minimum], check=True)
            for path in (f'/boot/vmlinuz-{release}', f'/boot/initrd.img-{release}', f'/lib/modules/{release}'):
                if not Path(path).exists():
                    sys.exit(f'Missing boot prerequisite: {path}')
            config = Path('/boot/grub/grub.cfg').read_text()
            submenu = re.search(r"(?m)^submenu .* '(gnulinux-advanced-[^']+)'", config)
            entry = re.search(r"(?m)^\s*menuentry .* '(gnulinux-" + re.escape(release) + r"-advanced-[^']+)'", config)
            if submenu is None or entry is None or 'set default="0"' not in config:
                sys.exit('Expected the Ubuntu kernel in GRUB and automatic selection of the newest kernel')
            environment = subprocess.check_output(['grub-editenv', 'list'], text=True)
            if any(line.startswith('next_entry=') and line != 'next_entry=' for line in environment.splitlines()):
                sys.exit('An existing GRUB one-time boot override needs to be resolved before rebooting')
            print(f'{submenu[1]}>{entry[1]}')
          - "{{ agent_kernel_release }}"
          - "{{ agent_kernel_security_min_versions[ansible_facts['distribution_version']] }}"
      register: agent_kernel_boot_entry
      changed_when: false

    # Keep the mainline image available until the Ubuntu image has booted.
    - name: Select the Ubuntu kernel for the next boot
      ansible.builtin.command:
        argv:
          - grub-reboot
          - "{{ agent_kernel_boot_entry.stdout }}"
      when: ansible_facts['kernel'] != agent_kernel_release
      changed_when: true

    - name: Reboot into the Ubuntu security kernel
      ansible.builtin.reboot:
        msg: Rebooting to restore Ubuntu kernel security updates
        reboot_timeout: 600
        connect_timeout: 10
        post_reboot_delay: 15
      when: ansible_facts['kernel'] != agent_kernel_release

    - name: Refresh running kernel facts after installation
      ansible.builtin.setup:
        gather_subset:
          - '!all'
          - '!min'
          - kernel

    - name: Assert the Ubuntu security kernel is running before cleanup
      ansible.builtin.assert:
        that:
          - ansible_facts['kernel'] == agent_kernel_release
        fail_msg: >-
          expected running Ubuntu kernel {{ agent_kernel_release }};
          got {{ ansible_facts['kernel'] }}. Mainline packages have been kept for recovery.

    - name: Collect installed kernel packages
      ansible.builtin.package_facts:
        manager: auto

    - name: Find obsolete mainline kernel packages
      ansible.builtin.set_fact:
        agent_mainline_kernel_packages: >-
          {{ ansible_facts['packages'].keys()
            | select('match', '^linux-(image(-unsigned)?|modules(-extra)?|headers)-[0-9]+[.][0-9]+[.][0-9]+-[0-9]{6}(-generic)?$')
            | list }}

    - name: Remove mainline packages after the Ubuntu kernel has booted
      ansible.builtin.apt:
        name: "{{ agent_mainline_kernel_packages }}"
        state: absent
        purge: true
        lock_timeout: 120
      when: agent_mainline_kernel_packages | length > 0
      register: agent_mainline_kernel_removal

    - name: Refresh GRUB after retiring the mainline kernel
      ansible.builtin.command: update-grub
      when: agent_mainline_kernel_removal is changed
      changed_when: true

    - name: Verify future boots select the Ubuntu kernel automatically
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - |
            from pathlib import Path
            import re
            import sys

            config = Path('/boot/grub/grub.cfg').read_text()
            first_kernel = re.search(r'(?m)^\s*linux(?:efi)?\s+\S*/vmlinuz-(\S+)', config)
            if first_kernel is None or first_kernel[1] != sys.argv[1] or 'set default="0"' not in config:
                sys.exit('GRUB must automatically select the Ubuntu kernel as its default entry')
          - "{{ agent_kernel_release }}"
      changed_when: false

    - name: Configure agent workloads for the running kernel
      ansible.builtin.import_tasks: kernel-sysctl.yaml

- name: Validate trusted Docker host sources
  ansible.builtin.assert:
    that:
      - item.interface is match('^[A-Za-z0-9][A-Za-z0-9_.-]*[+]?$')
      - item.interface | length <= 15
      - item.subnet is match('^[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+/([1-9]|[12][0-9]|3[0-2])$')
    fail_msg: "Docker host sources must specify an interface or prefix and an IPv4 CIDR: {{ item }}"
  loop: "{{ agent_docker_host_sources }}"

- name: Build allowed ufw rule descriptions
  ansible.builtin.set_fact:
    agent_ufw_allowed_rule_lines: >-
      {{ agent_ufw_allowed_rule_text.splitlines() | reject('equalto', '') | list }}
  vars:
    agent_ufw_allowed_rule_text: |
      22/tcp ALLOW IN Anywhere
      60000:61000/udp ALLOW IN Anywhere
      22/tcp (v6) ALLOW IN Anywhere (v6)
      60000:61000/udp (v6) ALLOW IN Anywhere (v6)
      {% for source in agent_docker_host_sources %}
      Anywhere on {{ source.interface }} ALLOW IN {{ source.subnet }}
      {% endfor %}

- name: Read numbered ufw rules
  ansible.builtin.command:
    argv:
      - ufw
      - status
      - numbered
  environment:
    LC_ALL: C
  register: agent_ufw_status
  changed_when: false

- name: Normalize ufw rule descriptions
  ansible.builtin.set_fact:
    agent_ufw_rule_lines: >-
      {{ agent_ufw_status.stdout_lines
        | select('match', '^\[')
        | map('regex_replace', '^\[[ ]*[0-9]+\][ ]*', '')
        | map('regex_replace', '[ ]+#.*$', '')
        | map('regex_replace', '[ ]+', ' ')
        | map('trim') | list }}
    agent_ufw_unexpected_rule_numbers: []

- name: Find unexpected ufw rule numbers
  ansible.builtin.set_fact:
    agent_ufw_unexpected_rule_numbers: >-
      {{ agent_ufw_unexpected_rule_numbers
        + [(item | regex_findall('^\[[ ]*([0-9]+)\]') | first | int)] }}
  loop: >-
    {{ agent_ufw_status.stdout_lines | select('match', '^\[') | list }}
  when: >-
    (item | regex_replace('^\[[ ]*[0-9]+\][ ]*', '')
    | regex_replace('[ ]+#.*$', '') | regex_replace('[ ]+', ' ') | trim)
    not in agent_ufw_allowed_rule_lines

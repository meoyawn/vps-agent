- name: Update apt packages and agent user tools
  hosts: vps
  become: true
  gather_facts: true
  tasks:
    - name: Update apt package indexes and upgrade installed packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        autoremove: true
        autoclean: true
        cache_valid_time: 3600

    - name: Update Bun for agent user
      ansible.builtin.command:
        argv:
          - "{{ agent_bun_binary_path }}"
          - upgrade
          - --stable
      become: true
      become_user: "{{ agent_user }}"
      environment:
        HOME: "{{ agent_home }}"
        PATH: "{{ agent_path }}"
      changed_when: false

    - name: Read updated Bun version
      ansible.builtin.command:
        argv:
          - "{{ agent_bun_binary_path }}"
          - --version
      become: true
      become_user: "{{ agent_user }}"
      environment:
        HOME: "{{ agent_home }}"
        PATH: "{{ agent_path }}"
      register: agent_updated_bun_version
      changed_when: false

    - name: Assert updated Bun version is supported
      ansible.builtin.assert:
        that:
          - >-
            agent_updated_bun_version.stdout
            is ansible.builtin.version('1.4.0', 'ge', version_type='semver')
        fail_msg: >-
          expected Bun 1.4.0 or newer after update;
          got {{ agent_updated_bun_version.stdout | default('missing') }}

    - name: Update Nub for agent user
      ansible.builtin.command:
        argv:
          - "{{ agent_nub_binary_path }}"
          - upgrade
          - --stable
          - --yes
      become: true
      become_user: "{{ agent_user }}"
      environment:
        HOME: "{{ agent_home }}"
        PATH: "{{ agent_path }}"
      changed_when: false

    - name: Verify updated Nub binary
      ansible.builtin.command:
        argv:
          - "{{ agent_nub_binary_path }}"
          - --version
      become: true
      become_user: "{{ agent_user }}"
      environment:
        HOME: "{{ agent_home }}"
        PATH: "{{ agent_path }}"
      changed_when: false

    - name: Update uv for agent user
      ansible.builtin.command:
        argv:
          - "{{ agent_uv_binary_path }}"
          - self
          - update
      become: true
      become_user: "{{ agent_user }}"
      environment:
        HOME: "{{ agent_home }}"
        PATH: "{{ agent_path }}"
      changed_when: false
      failed_when: false

    - name: Update Codex for agent user
      # Codex's supported update path is the official installer, which resolves the latest release.
      ansible.builtin.shell: |
        set -euo pipefail
        curl -fsSL "{{ agent_codex_install_url }}" | sh
      args:
        executable: /bin/bash
      become: true
      become_user: "{{ agent_user }}"
      environment:
        HOME: "{{ agent_home }}"
        PATH: "{{ agent_path }}"
        CODEX_NON_INTERACTIVE: "1"
      changed_when: false

    - name: Verify updated Codex binary
      ansible.builtin.command:
        argv:
          - "{{ agent_codex_binary_path }}"
          - --version
      become: true
      become_user: "{{ agent_user }}"
      environment:
        HOME: "{{ agent_home }}"
        PATH: "{{ agent_path }}"
      changed_when: false
